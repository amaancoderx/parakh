[project]
name = "harness"
version = "0.1.0"
description = "Voice harness for Indian phone speech: names, numbers, code-mixed Hindi-English"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.100",
    "jiwer>=3.0",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "indic-transliteration>=2.3.82",
    "wordfreq>=3.1.1",
    "rapidfuzz>=3.14.5",
    "pyarrow>=25.0.1",
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# The experimental acoustic arbiter (harness/phones.py): about 2 GB of wheels plus a 1.2 GB model.
# Off by default; nothing else needs it.  uv sync --extra acoustic
acoustic = [
    "torch>=2.14.1",
    "torchaudio>=2.11.1",
    "transformers>=5.20.2",
    "phonemizer>=3.6.0",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
