[project]
name = "harness"
version = "0.1.0"
description = "Voice harness for Indian phone speech: names, numbers, code-mixed Hindi-English"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.100",
    "jiwer>=3.0",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "indic-transliteration>=2.3.82",
    "wordfreq>=3.1.1",
    "rapidfuzz>=3.14.5",
    "pyarrow>=25.0.1",
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
